name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  python:
    name: Python regressions and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned grammar generator dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bison

      - name: Run offline regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify PostgreSQL grammar inventory and Lean tables
        run: |
          python3 scripts/inventory_postgresql_grammar.py --check
          python3 scripts/generate_postgresql_grammar.py --check

      - name: Reject Lean proof placeholders and bypasses
        run: python3 scripts/check_lean_trust.py --source-only

      - name: Check generated fixtures
        run: |
          for generator in scripts/generate_*_examples.py; do
            python3 "$generator" --check
          done

      - name: Verify unchanged source statements and provenance
        run: |
          python3 scripts/extract_pagination_corpus.py --check
          python3 scripts/extract_extended_type_corpus.py --check
          python3 scripts/extract_factor_corpus.py --factor functions --check
          python3 scripts/extract_factor_corpus.py --factor conditional --check
          python3 scripts/extract_factor_corpus.py --factor locking --check
          python3 scripts/extract_factor_corpus.py --factor join_contract --check
          python3 scripts/extract_factor_corpus.py --factor using_contract --check
          python3 scripts/extract_factor_corpus.py --factor natural_contract --check
          python3 scripts/extract_factor_corpus.py --factor derived_contract --check
          python3 scripts/extract_factor_corpus.py --factor array_types --check
          python3 scripts/extract_factor_corpus.py --factor array_constructors --check
          python3 scripts/extract_factor_corpus.py --factor array_quantified --check
          python3 scripts/extract_factor_corpus.py --factor array_subscripts --check
          python3 scripts/extract_factor_corpus.py --factor row_comparisons --check
          python3 scripts/extract_factor_corpus.py --factor concatenation --check
          python3 scripts/extract_factor_corpus.py --factor ilike --check
          python3 scripts/extract_factor_corpus.py --factor regex --check
          python3 scripts/extract_factor_corpus.py --factor json_extraction --check
          python3 scripts/extract_factor_corpus.py --factor json_containment --check
          python3 scripts/extract_factor_corpus.py --factor array_concatenation --check
          python3 scripts/extract_factor_corpus.py --factor array_containment --check
          python3 scripts/extract_factor_corpus.py --factor array_overlap --check
          python3 scripts/extract_factor_corpus.py --factor extract --check
          python3 scripts/extract_factor_corpus.py --factor interval_fields --check
          python3 scripts/extract_factor_corpus.py --factor substring --check
          python3 scripts/extract_factor_corpus.py --factor qualified_names --check
          python3 scripts/extract_statement_corpus.py --check

  integration:
    name: Lean and database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-client-16

      - name: Build Lean library, CLI, and tests
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: "false"
          build: "true"
          # This project uses an explicit test executable, not `lake test`.
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          # Recompile proofs and executables on every run.
          use-github-cache: "false"

      - name: Run Lean tests and proof examples
        run: |
          lake exe sqlean_tests
          lake exe sqlean_scope_tests

      - name: Audit all project declarations and proof dependencies
        run: python3 scripts/check_lean_trust.py --evidence-json .lake/trust-audit.json

      - name: Check SELECT assurance tiers
        run: python3 scripts/check_assurance_cli.py

      - name: Check full PostgreSQL grammar and exact source certificates
        run: python3 scripts/check_postgresql_grammar_cli.py

      - name: Check renderer profiles across the SELECT syntax corpus
        run: python3 scripts/check_renderer_corpus.py

      - name: Check SQLite CLI compatibility
        run: |
          python3 scripts/check_crud_cli.py
          python3 scripts/check_relational_cli.py
          python3 scripts/check_industrial_cli.py

      # Each checker creates and removes its own private Unix-socket cluster.
      # Run as the normal runner user: PostgreSQL initdb refuses root.
      # These are finite database observations, separate from Lean compilation
      # and structural round-trip certificates; not universal SQL semantics.
      - name: Check SELECT renderer against PostgreSQL 16
        run: python3 scripts/check_render_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check SELECT dialects against SQLite and PostgreSQL 16
        run: |
          python3 -c 'import sqlite3; print("SQLite runtime:", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 39, 0), "SQLite 3.39+ required"'
          python3 scripts/check_dialect_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check expression pagination contracts and bound execution
        run: python3 scripts/check_pagination_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check scalar functions and conditional contracts
        run: python3 scripts/check_scalar_forms_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check row-locking contracts and native lock observations
        run: python3 scripts/check_locking_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check independent JOIN contracts and native row observations
        run: python3 scripts/check_join_contract_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check USING and NATURAL contracts and merged columns
        run: python3 scripts/check_merged_join_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check nested derived-source contracts and parameter order
        run: python3 scripts/check_derived_contract_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check array types and exact prepared result descriptors
        run: python3 scripts/check_array_types_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check ARRAY constructors, contextual casts, and runtime boundaries
        run: python3 scripts/check_array_constructors_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check ANY, SOME, ALL and exact scalar operator signatures
        run: python3 scripts/check_array_quantified_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check array subscripts, slices, and output label descriptors
        run: python3 scripts/check_array_subscripts_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check row-constructor comparison contracts and native observations
        run: python3 scripts/check_row_comparisons_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check concatenation contracts and native overload observations
        run: python3 scripts/check_concatenation_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check ILIKE and regular-expression contracts and native observations
        run: python3 scripts/check_pattern_matching_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check JSON extraction contracts and native result descriptors
        run: python3 scripts/check_json_extraction_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check JSONB containment contracts and native operator signatures
        run: python3 scripts/check_json_containment_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check array concatenation contracts and native polymorphic signatures
        run: python3 scripts/check_array_concatenation_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check array containment and overlap contracts and native signatures
        run: python3 scripts/check_array_predicates_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check EXTRACT contracts and native temporal observations
        run: python3 scripts/check_extract_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check interval field qualifiers and exact native type modifiers
        run: python3 scripts/check_interval_fields_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check SUBSTRING contracts and native text and bytea observations
        run: python3 scripts/check_substring_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check qualified names and native namespace resolution
        run: python3 scripts/check_qualified_names_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check exact scalar types and native PostgreSQL type results
        run: python3 scripts/check_extended_types_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check PostgreSQL corpus
        run: python3 scripts/check_postgresql_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check advanced PostgreSQL corpus
        run: python3 scripts/check_advanced_cli.py --local-bin /usr/lib/postgresql/16/bin

      - name: Check actual parameter execution
        run: python3 scripts/check_parameter_execution.py --local-bin /usr/lib/postgresql/16/bin
